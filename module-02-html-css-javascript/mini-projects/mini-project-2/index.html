<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations - Habesha Eatery</title>
    <meta name="description" content="Reserve a table and view our authentic Ethiopian menu at Habesha Eatery in Bole, Addis Ababa.">
</head>
<body>
    <header>
        <h1>Habesha Eatery</h1>
    </header>
    
    <nav>
        <ul>
            <li><a href="index.html" aria-current="page">Reservations</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    
    <main>
        <h2>Table Reservations</h2>
        
        <form action="/reserve" method="post">
            <p>
                <label for="tel">Phone Number:</label>
                <input id="tel" name="tel" type="tel" pattern="\+251[0-9]{9}" required aria-describedby="tel-help">
                <span id="tel-help" style="display: block; font-size: 0.9em; color: #555;">Format: +251 followed by 9 digits.</span>
            </p>
            <p>
                <label for="size">Party Size:</label>
                <input id="size" name="size" type="number" min="1" max="12" required>
            </p>
            <button type="submit">Book Table</button>
        </form>
        
        <hr>

        <table>
            <caption>Habesha Eatery main menu</caption>
            <thead>
                <tr>
                    <th scope="col">Dish</th>
                    <th scope="col">Price (ETB)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">Doro Wat</th>
                    <td>320</td>
                </tr>
                <tr>
                    <th scope="row">Shiro</th>
                    <td>180</td>
                </tr>
                <tr>
                    <th scope="row">Tibs</th>
                    <td>360</td>
                </tr>
            </tbody>
        </table>
        
        <hr>
        
        <figure>
            <img src="doro-wat.jpg" alt="A plate of doro wat served on injera" width="640" height="420" loading="lazy">
            <figcaption>Bete Giyorgis, one of the rock-hewn churches of Lalibela.</figcaption>
        </figure>
        
        <iframe src="https://maps.example/embed?q=Bole, Addis+Ababa" title="Map showing Habesha Eatery in Bole" width="100%" height="320" loading="lazy"></iframe>
    </main>
    
    <footer>
        <p>Bole, Addis Ababa | Phone: +251 911 234 567</p>
    </footer>
</body>
</html>
