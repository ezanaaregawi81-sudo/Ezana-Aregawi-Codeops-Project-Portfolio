<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Demonstration</title>
</head>
<body>
  <link rel="stylesheet" href="box.css">
<div class="container">
  <h2>Content-Box Demonstration</h2>
  <div class="card card-content-box">
    <h3>Content-Box Card</h3>
    <p>Width: 300px + Padding: 48px + Border: 4px = Total 352px wide.</p>
  </div>

  <h2>Border-Box Demonstration</h2>
  <div class="card card-border-box">
    <h3>Border-Box Card</h3>
    <p>Width: 300px (Padding and border absorbed inside) = Total 300px wide.</p>
  </div>
</div>
</body>
</html>
